<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Geldzähler" />
    <title>Geldzähler</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="icons/icon-192x192.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Header with Top Stats -->
      <header class="app-header">
        <div class="header-top">
          <div class="logo">
            <svg
              class="ui-icon logo-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17" />
              <path
                d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"
              />
              <path d="m2 16 6 6" />
              <circle cx="16" cy="9" r="2.9" />
              <circle cx="6" cy="5" r="3" />
            </svg>
            <h1>Geldzähler</h1>
          </div>
          <div class="header-actions">
            <button
              id="resetPileBtn"
              class="icon-btn danger-icon"
              title="Aktuellen Stapel leeren"
            >
              <svg
                class="ui-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"
                />
                <path d="m5.082 11.09 8.828 8.828" />
              </svg>
              <span class="btn-label">Leeren</span>
            </button>
          </div>
        </div>

        <!-- Grand Total Overview Banner -->
        <div class="grand-total-banner">
          <div class="total-col">
            <span class="total-label">Aktueller Stapel</span>
            <span class="total-amount" id="currentPileTotal">0,00 €</span>
          </div>
          <div class="total-divider"></div>
          <div class="total-col">
            <span class="total-label"
              >Gesamtsumme (<span id="pileCountBadge">1</span>)</span
            >
            <span class="total-amount highlight" id="grandTotal">0,00 €</span>
          </div>
        </div>

        <!-- Pile Tabs Bar -->
        <nav class="piles-nav-wrapper">
          <div class="piles-tabs" id="pilesTabs">
            <!-- Dynamically populated pile tabs -->
          </div>
          <button
            id="addPileBtn"
            class="add-pile-btn"
            title="Neuen Stapel hinzufügen"
          >
            <span>+ Stapel</span>
          </button>
        </nav>
      </header>

      <!-- Main Denomination Counter List -->
      <main class="content-area">
        <!-- Banknotes Section -->
        <section class="denom-section" id="section-bills" data-category="bills">
          <button
            class="section-header collapsable-header"
            data-toggle="bills"
            type="button"
            aria-expanded="true"
          >
            <div class="header-title-wrap">
              <span class="collapse-icon">▼</span>
              <h2>Scheine</h2>
            </div>
            <span class="section-subtotal" id="billsSubtotal">0,00 €</span>
          </button>
          <div class="denom-grid" id="billsGrid">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Coin Rolls Section -->
        <section class="denom-section" id="section-rolls" data-category="rolls">
          <button
            class="section-header collapsable-header"
            data-toggle="rolls"
            type="button"
            aria-expanded="true"
          >
            <div class="header-title-wrap">
              <span class="collapse-icon">▼</span>
              <h2>Wechselgeld</h2>
            </div>
            <span class="section-subtotal" id="rollsSubtotal">0,00 €</span>
          </button>
          <div class="denom-grid" id="rollsGrid">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Coins Section -->
        <section class="denom-section" id="section-coins" data-category="coins">
          <button
            class="section-header collapsable-header"
            data-toggle="coins"
            type="button"
            aria-expanded="true"
          >
            <div class="header-title-wrap">
              <span class="collapse-icon">▼</span>
              <h2>Münzen</h2>
            </div>
            <span class="section-subtotal" id="coinsSubtotal">0,00 €</span>
          </button>
          <div class="denom-grid" id="coinsGrid">
            <!-- Populated by JS -->
          </div>
        </section>
      </main>

      <!-- Sticky Bottom Bar for Mobile Quick Feedback -->
      <footer class="sticky-footer">
        <div class="footer-info">
          <span class="pile-name-badge" id="footerPileName">Stapel 1</span>
          <span class="footer-total" id="footerPileTotal">0,00 €</span>
        </div>
        <div class="footer-quick-actions">
          <button id="viewBreakdownBtn" class="action-btn primary">
            <svg
              class="ui-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 21v-6" />
              <path d="M12 21V3" />
              <path d="M19 21V9" />
            </svg>
            Übersicht
          </button>
        </div>
      </footer>
    </div>

    <!-- Numpad & Quick Input Modal -->
    <div
      class="modal-backdrop"
      id="inputModal"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-denom-badge" id="modalDenomBadge">50 €</div>
          <div class="modal-title-group">
            <h3 id="modalDenomTitle">50 € Schein</h3>
            <span id="modalDenomSubtotal">0 × 50 € = 0,00 €</span>
          </div>
          <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>

        <div class="modal-display">
          <input
            type="text"
            id="modalValueInput"
            inputmode="numeric"
            pattern="[0-9]*"
            value="0"
            readonly
          />
          <span class="unit-label">Stück</span>
        </div>

        <!-- Quick increment buttons -->
        <div class="quick-add-row">
          <button class="quick-chip" data-add="1">+1</button>
          <button class="quick-chip" data-add="5">+5</button>
          <button class="quick-chip" data-add="10">+10</button>
          <button class="quick-chip" data-add="20">+20</button>
          <button class="quick-chip" data-add="50">+50</button>
        </div>

        <!-- Numeric keypad -->
        <div class="numpad-grid">
          <button class="num-key" data-key="1">1</button>
          <button class="num-key" data-key="2">2</button>
          <button class="num-key" data-key="3">3</button>
          <button class="num-key" data-key="4">4</button>
          <button class="num-key" data-key="5">5</button>
          <button class="num-key" data-key="6">6</button>
          <button class="num-key" data-key="7">7</button>
          <button class="num-key" data-key="8">8</button>
          <button class="num-key" data-key="9">9</button>
          <button class="num-key action-clear" data-key="clear">C</button>
          <button class="num-key" data-key="0">0</button>
          <button class="num-key action-back" data-key="back">⌫</button>
        </div>

        <div class="modal-footer-btns">
          <button id="modalPrevDenomBtn" class="nav-step-btn">
            ‹ Vorherige
          </button>
          <button id="modalConfirmBtn" class="confirm-btn">Fertig</button>
          <button id="modalNextDenomBtn" class="nav-step-btn">Nächste ›</button>
        </div>
      </div>
    </div>

    <!-- Custom Prompt/Rename Dialog Modal (Replaces native browser prompt) -->
    <div
      class="modal-backdrop"
      id="promptModal"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-card dialog-card">
        <div class="modal-header">
          <h3 id="promptTitle">Stapel benennen</h3>
          <button class="close-btn" id="closePromptBtn">&times;</button>
        </div>
        <div class="dialog-body">
          <input
            type="text"
            id="promptInput"
            class="dialog-text-input"
            placeholder="Name eingeben..."
          />
        </div>
        <div class="dialog-actions">
          <button id="cancelPromptBtn" class="action-btn secondary">
            Abbrechen
          </button>
          <button id="confirmPromptBtn" class="action-btn primary">
            Speichern
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Confirmation Dialog Modal (Replaces native browser confirm) -->
    <div
      class="modal-backdrop"
      id="confirmModal"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-card dialog-card">
        <div class="modal-header">
          <h3 id="confirmTitle">Bestätigung</h3>
          <button class="close-btn" id="closeConfirmBtn">&times;</button>
        </div>
        <div class="dialog-body">
          <p id="confirmMessage" class="dialog-message">
            Möchtest du diese Aktion ausführen?
          </p>
        </div>
        <div class="dialog-actions">
          <button id="cancelConfirmBtn" class="action-btn secondary">
            Abbrechen
          </button>
          <button id="okConfirmBtn" class="action-btn danger">
            Ja, leeren
          </button>
        </div>
      </div>
    </div>

    <!-- Full Summary & Breakdown Modal -->
    <div
      class="modal-backdrop"
      id="summaryModal"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-card summary-card">
        <div class="modal-header">
          <h3>
            <svg
              class="ui-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 21v-6" />
              <path d="M12 21V3" />
              <path d="M19 21V9" />
            </svg>
            Gesamtabrechnung
          </h3>
          <button class="close-btn" id="closeSummaryModalBtn">&times;</button>
        </div>
        <div class="summary-body" id="summaryBody">
          <!-- Rendered breakdown table & piles -->
        </div>
        <div class="summary-actions">
          <button id="closeSummaryBtn" class="action-btn primary">
            Schließen
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Kopiert!</div>

    <script src="main.js"></script>
  </body>
</html>
